<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小霸王街机厅</title>
<style>
  :root{
    --ink:#e8e8f0; --dim:#8b8fb0; --gold:#ffd24a; --red:#ff5a5a; --cyan:#4ad6ff;
    --bg:#07070d; --panel:#12131f; --panel2:#181a2b; --line:#2a2d45;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1100px 620px at 50% -12%, #1b2340 0%, rgba(7,7,13,0) 62%),
      radial-gradient(700px 420px at 92% 106%, #2a1633 0%, rgba(7,7,13,0) 60%),
      var(--bg);
    color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:18px 14px; overflow:hidden;
  }
  .cab{width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
  /* ---------- 顶栏 ---------- */
  .cab-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .led{
    width:9px;height:9px;border-radius:50%;background:var(--red);align-self:center;
    box-shadow:0 0 10px var(--red),0 0 22px rgba(255,90,90,.55);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .brand h1{
    margin:0;font-size:19px;letter-spacing:.06em;font-weight:800;
    color:var(--gold);text-shadow:0 0 18px rgba(255,210,74,.35);
  }
  .brand .sub{font-size:10px;letter-spacing:.26em;color:var(--dim);white-space:nowrap}
  .cab-actions{margin-left:auto;display:flex;gap:8px}
  button{
    font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s ease;
  }
  button:hover{border-color:#3d4166;background:#1f2237}
  button:active{transform:translateY(1px)}
  #btn-close{color:#ffb0b0}
  /* ---------- 标签页 ---------- */
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{
    display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
    border:1px solid var(--line);background:linear-gradient(180deg,#171a2c,#111321);
    color:var(--dim);cursor:pointer;font-size:13px;letter-spacing:.02em;transition:.15s ease;
  }
  .tab:hover{color:var(--ink);border-color:#3d4166}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:#3a3f60}
  .tab.on{
    color:#0d0f1a;background:linear-gradient(180deg,var(--gold),#e8ae1f);
    border-color:var(--gold);font-weight:700;box-shadow:0 6px 20px rgba(255,210,74,.22);
  }
  .tab.on .dot{background:#0d0f1a}
  /* ---------- 屏幕 ---------- */
  .screen-wrap{
    position:relative;border-radius:14px;overflow:hidden;background:#000;
    border:1px solid #2b2f4a;
    box-shadow:0 0 0 4px #0d0e18, 0 18px 50px rgba(0,0,0,.65),
               inset 0 0 60px rgba(80,120,255,.06);
  }
  #screen{display:block;width:100%;height:auto;aspect-ratio:640/400;background:#07070d;image-rendering:pixelated}
  .scan{
    position:absolute;inset:0;pointer-events:none;border-radius:14px;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  .scan::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);
  }
  .overlay{
    position:absolute;inset:0;display:none;place-items:center;text-align:center;
    background:rgba(5,6,12,.72);backdrop-filter:blur(2px);padding:24px;
    font-size:15px;line-height:1.8;letter-spacing:.02em;white-space:pre-line;
  }
  .overlay.on{display:grid}
  .overlay b{color:var(--gold);font-size:20px;display:block;margin-bottom:6px}
  /* ---------- HUD ---------- */
  .hud{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:9px 14px;border:1px solid var(--line);border-radius:11px;
    background:linear-gradient(180deg,#141626,#101120);font-size:12.5px;
  }
  .hud .item{color:var(--dim);white-space:nowrap}
  .hud .item b{color:var(--cyan);font-variant-numeric:tabular-nums;margin-left:5px}
  .hud .item#hud-extra{color:var(--gold)}
  .hud .keys{margin-left:auto;color:#6b6f92;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:720px){
    .brand .sub{display:none}
    .hud .keys{display:none}
  }
</style>
</head>
<body>
  <div class="cab">
    <header class="cab-top">
      <div class="brand">
        <span class="led" aria-hidden="true"></span>
        <h1>小霸王街机厅</h1>
        <span class="sub">XIAOBAWANG ARCADE</span>
      </div>
      <div class="cab-actions">
        <button id="btn-sound" type="button" title="音效开关">🔊 音效</button>
        <button id="btn-reset" type="button" title="重新开始 (Enter)">↻ 重开</button>
        <button id="btn-close" type="button" title="关闭 (Esc)">✕ 关闭</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="选择游戏"></nav>

    <div class="screen-wrap">
      <canvas id="screen" width="640" height="400" aria-label="游戏画面"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div class="overlay" id="overlay" role="status"></div>
    </div>

    <footer class="hud">
      <div class="item">得分<b id="hud-score">0</b></div>
      <div class="item">生命<b id="hud-lives">3</b></div>
      <div class="item" id="hud-extra"></div>
      <div class="keys">方向键移动 · Z 跳跃/确认 · X 射击/放炸弹 · Enter 重开 · Esc 关闭</div>
    </footer>
  </div>

  <script src="games/mario.js"></script>
  <script src="games/contra.js"></script>
  <script src="games/bomberman.js"></script>
  <script src="games/loderunner.js"></script>
  <script src="arcade.js"></script>
</body>
</html>
